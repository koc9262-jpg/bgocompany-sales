name: Update BGO Dashboard
on:
  push:
    paths:
      - 'data/**'
  workflow_dispatch:
jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - run: python update_dashboard.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update dashboard $(date +%Y-%m-%d)"
          git push
      - name: Telegram 알림
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TODAY=$(date +%y%m)
          COUNT=$(ls data/${TODAY}*.xlsx 2>/dev/null | wc -l | tr -d ' ')
          echo "Today files: $COUNT"
          DATE_KR=$(date +"%Y년 %m월 %d일")
          MESSAGE="🎉 BGO 매출 대시보드 업데이트 완료!%0A📅 기준일: ${DATE_KR}%0A📊 7개 지점 전체 파일 수신 완료%0A🔗 https://koc9262-jpg.github.io/bgocompany-sales/"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}&text=${MESSAGE}"
          echo "Telegram notification sent!"
