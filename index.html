<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGO 매출 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0f1e;--bg2:#111827;--bg3:#1a2235;--bg4:#1e293b;--border:#1e3a5f;--text:#e2e8f0;--muted:#64748b}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#0d1f3c 0%,#0a0f1e 100%);padding:20px 32px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:1.4rem;font-weight:800;color:#fff}
.header-left h1 span{color:#3b82f6}
.header-left .date{font-size:0.75rem;color:var(--muted);margin-top:3px}
.header-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hbadge{padding:5px 13px;border-radius:20px;font-size:0.75rem;font-weight:700;border:1px solid}
.hbadge-blue{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.4);color:#60a5fa}
.hbadge-green{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:#34d399}
.main{padding:24px 32px;max-width:1400px;margin:0 auto}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.kpi-grid{grid-template-columns:1fr}}
.kpi{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-blue::before{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.kpi-green::before{background:linear-gradient(90deg,#10b981,#34d399)}
.kpi-purple::before{background:linear-gradient(90deg,#8b5cf6,#a78bfa)}
.kpi-gold::before{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.kpi .label{font-size:0.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi .value{font-size:1.7rem;font-weight:800;color:#fff;line-height:1}
.kpi .sub{font-size:0.72rem;color:var(--muted);margin-top:5px}
.kpi .remain{font-size:0.72rem;font-weight:700;margin-top:5px;color:#f59e0b}
.section-hd{font-size:0.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.section-hd::after{content:'';flex:1;height:1px;background:var(--border)}
.branch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-bottom:28px}
.bc{background:var(--bg3);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;padding:16px 18px;transition:box-shadow .2s}
.bc:hover{box-shadow:0 4px 20px rgba(0,0,0,.4)}
.bc-good{border-left-color:#7c3aed}
.bc-ok{border-left-color:#10b981}
.bc-warn{border-left-color:#f59e0b}
.bc-bad{border-left-color:#ef4444}
.bc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.bc-name{font-size:1rem;font-weight:800;color:#fff;margin-bottom:2px}
.bc-meta{font-size:0.68rem;color:var(--muted)}
.bc-remain{font-size:0.68rem;color:#f59e0b;font-weight:600;margin-top:1px}
.rb{display:inline-block;padding:5px 12px;border-radius:10px;font-size:0.85rem;font-weight:800;min-width:60px;text-align:center}
.rb-good{background:rgba(124,58,237,.25);border:1px solid rgba(124,58,237,.5);color:#a78bfa}
.rb-ok{background:rgba(16,185,129,.2);border:1px solid rgba(16,185,129,.4);color:#34d399}
.rb-warn{background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);color:#fbbf24}
.rb-bad{background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.pr-rows{margin:0 0 10px}
.pr-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.pr-label{font-size:0.65rem;font-weight:700;color:var(--muted);width:24px;flex-shrink:0;text-transform:uppercase}
.pr-bar-bg{flex:1;height:7px;background:var(--bg2);border-radius:4px;overflow:hidden}
.pr-bar-fill{height:100%;border-radius:4px}
.pr-pct{font-size:0.7rem;font-weight:800;width:36px;text-align:right;flex-shrink:0}
.pr-nums{font-size:0.63rem;color:var(--muted);width:100px;text-align:right;flex-shrink:0;white-space:nowrap}
.bc-counts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cnt-tag{font-size:0.68rem;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.cnt-fc{background:rgba(59,130,246,.15);color:#60a5fa}
.cnt-pt{background:rgba(139,92,246,.15);color:#a78bfa}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
@media(max-width:800px){.chart-grid{grid-template-columns:1fr}}
.chart-box{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:20px}
.chart-box h3{font-size:0.78rem;font-weight:700;color:var(--muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em}
.chart-wrap{position:relative;height:220px}
.rank-box{background:var(--bg3);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.rk-header{padding:14px 20px;border-bottom:1px solid var(--border);font-size:0.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rank-row{display:flex;align-items:center;padding:10px 20px;border-bottom:1px solid rgba(30,58,95,.4);transition:background .15s}
.rank-row:last-child{border-bottom:none}
.rank-row:hover{background:var(--bg4)}
.rk-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:800;flex-shrink:0}
.rk-1{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000}
.rk-2{background:linear-gradient(135deg,#94a3b8,#64748b);color:#fff}
.rk-3{background:linear-gradient(135deg,#b45309,#92400e);color:#fff}
.rk-n{background:var(--bg2);color:var(--muted);border:1px solid var(--border)}
.rk-info{flex:1;margin:0 12px}
.rk-name{font-size:0.85rem;font-weight:700;color:#fff}
.rk-branch{font-size:0.68rem;color:var(--muted);margin-top:1px}
.rk-amt{font-size:0.87rem;font-weight:800;color:#fff;white-space:nowrap}
.rk-bar-wrap{width:60px;height:4px;background:var(--bg2);border-radius:2px;overflow:hidden;margin-left:10px}
.rk-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,#8b5cf6,#a78bfa)}
.legend-bar{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.lg-item{display:flex;align-items:center;gap:5px;font-size:0.7rem;color:var(--muted)}
.lg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.footer{text-align:center;padding:20px;color:var(--muted);font-size:0.7rem;border-top:1px solid var(--border);margin-top:28px}
</style>
</head>
<body>
 
<div class="header">
  <div class="header-left">
    <h1>🏋️ <span>BGO</span> 매출 대시보드</h1>

    <div class="kpi kpi-gold">

  <div class="section-hd">🏪 지점별 매출 현황</div>
  <div class="legend-bar">

  </div>
  <div class="branch-grid" id="branch-grid"></div>
 
  <div class="section-hd">📈 매출 분석</div>
  <div class="chart-grid">
    <div class="chart-box">
      <h3>지점별 실적 vs 목표 (만원)</h3>

    <div class="chart-box">

  <div class="rank-box">

    <div id="rank-list"></div>
  </div>
</div>
 
<div class="footer">휴메이크휘트니스 · 위스테이피트니스 · 모션하이브 | 데이터 기준: 2026년 08월 20일 | 매일 14:00 자동 갱신</div>

  const m = w(v);
  if (Math.abs(m) >= 10000) {
    const ok = Math.floor(Math.abs(m) / 10000);

      <div class="bc-counts">
        <span class="cnt-tag cnt-fc">FC 신규 ${d.fc_new_cnt}건 · 재등록 ${d.fc_re_cnt}건</span>
        <span class="cnt-tag cnt-pt">PT 신규 ${d.pt_new_cnt}건 · 재등록 ${d.pt_re_cnt}건</span>
      </div>
    </div>`;
  });
})();
 
(function() {
  const sorted = [...D_RAW].sort((a, b) => b.rate_tot - a.rate_tot);
  const labels = sorted.map(r => r.branch);
  new Chart(document.getElementById('chartTarget').getContext('2d'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: '실적', data: sorted.map(r => w(r.actual_tot)), backgroundColor: 'rgba(59,130,246,.85)', borderRadius: 5 },
        { label: '목표', data: sorted.map(r => w(r.target_tot)), backgroundColor: 'rgba(255,255,255,.08)', borderRadius: 5, borderWidth: 1, borderColor: 'rgba(255,255,255,.2)' }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#94a3b8', font:{size:11} } } },
      scales: {
        y: { beginAtZero: true, ticks: { color: '#64748b', callback: v => v.toLocaleString() + '만' }, grid: { color: 'rgba(255,255,255,.04)' } },
        x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
      }
    }
  });
  new Chart(document.getElementById('chartFC').getContext('2d'), {
    type: 'bar',
    data: {
      labels: sorted.map(r => r.branch),
      datasets: [
        { label: '신규', data: sorted.map(r => r.fc_new_cnt), backgroundColor: 'rgba(59,130,246,.8)', borderRadius: 4, stack: 's' },
        { label: '재등록', data: sorted.map(r => r.fc_re_cnt), backgroundColor: 'rgba(16,185,129,.8)', borderRadius: 4, stack: 's' }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#94a3b8', font:{size:11} } } },
      scales: {
        y: { beginAtZero: true, ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,.04)' } },
        x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
      }
    }
  });
})();
 
(function() {
  let all = [];
  D_RAW.forEach(r => r.ranks.forEach(rk => all.push({ ...rk, branch: r.branch })));
  all.sort((a, b) => b.amount - a.amount);
  const maxAmt = all[0]?.amount || 1;
  const list = document.getElementById('rank-list');
  all.forEach((r, i) => {
    const n = i + 1;
    const cls = n===1?'rk-1':n===2?'rk-2':n===3?'rk-3':'rk-n';
    const barW = Math.round(r.amount / maxAmt * 100);
    list.innerHTML += `<div class="rank-row">
      <span class="rk-num ${cls}">${n}</span>
      <div class="rk-info"><div class="rk-name">${r.name}</div><div class="rk-branch">${r.branch}</div></div>
      <div class="rk-amt">${fmt(w(r.amount))}만원</div>
      <div class="rk-bar-wrap"><div class="rk-bar" style="width:${barW}%"></div></div>
    </div>`;
  });
})();
</script>
</body>
</html>
